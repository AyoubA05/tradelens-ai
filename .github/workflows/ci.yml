name: TradeLens AI — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEMO_MODE: "true"
  ANTHROPIC_API_KEY: "sk-demo-placeholder"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DEMO_MODE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff (linter)
        run: ruff check src/ scripts/

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Coverage gate (services >= 80%)
        run: pytest --cov=src/tradelens/services --cov-fail-under=80 -q

      - name: Build marketing site (smoke test)
        env:
          SITE_ORIGIN: https://www.tradelensai.io
          APP_ORIGIN: https://tradelens-app.streamlit.app
          SUPPORT_EMAIL: support@example.com
        run: python -m scripts.build_site
