name: TradeLens AI — CI

on:
  push:
    # The Phase 0 branch is listed so the full network-enabled workflow can run
    # against it before it is merged. Remove the entry once Phase 0 lands.
    branches: [main, worktree-phase0-foundations]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEMO_MODE: "true"
  ANTHROPIC_API_KEY: "sk-demo-placeholder"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DEMO_MODE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pip-audit==2.10.1

      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements-api.txt

      - name: Run ruff (linter)
        run: ruff check src/ scripts/

      - name: Run black (formatter check)
        run: black --check src/ scripts/ tests/

      - name: Alembic migrations apply and reverse
        # A migration that cannot be rolled back is a deploy that cannot be
        # undone. The Phase 0 pair is exercised in both directions, and a
        # single head is asserted so a branched chain fails here rather than
        # at deploy time.
        env:
          DATABASE_URL: sqlite:///./data/ci-migrations.db
        run: |
          mkdir -p data
          heads="$(alembic heads | wc -l | tr -d ' ')"
          test "$heads" = "1" || { echo "expected exactly one Alembic head"; alembic heads; exit 1; }
          alembic upgrade head
          alembic downgrade -1
          alembic downgrade -1
          alembic upgrade head

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Set up Node (for API schema/type drift check)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (for schema/type drift check)
        working-directory: web
        run: npm ci

      - name: API schema and client types are current
        run: |
          python scripts/generate_signature_expectations.py
          python scripts/generate_canonical_query_cases.py
          python scripts/generate_openapi.py
          cd web && npm run api:types
          cd .. && git diff --exit-code -- web/lib/api web/__tests__/fixtures

      - name: Coverage gate (services >= 80%)
        run: pytest --cov=src/tradelens/services --cov-fail-under=80 -q

      - name: Build marketing site (smoke test)
        env:
          SITE_ORIGIN: https://www.tradelensai.io
          APP_ORIGIN: https://tradelens-app.streamlit.app
          SUPPORT_EMAIL: support@example.com
        run: python -m scripts.build_site

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SITE_ORIGIN: https://www.tradelensai.io
      APP_ORIGIN: https://tradelenai.streamlit.app
      SUPPORT_EMAIL: support@tradelensai.io
      SIGNUP_MODE: closed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Run web lint
        run: npm run lint

      - name: Run web typecheck
        run: npm run typecheck

      - name: Build the deployed Next.js app
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
