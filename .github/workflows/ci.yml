name: TradeLens AI — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEMO_MODE: "true"
  ANTHROPIC_API_KEY: "sk-demo-placeholder"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DEMO_MODE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pip-audit==2.10.1

      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements-api.txt

      - name: Run ruff (linter)
        run: ruff check src/ scripts/

      - name: Run black (formatter check)
        run: black --check src/ scripts/ tests/

      - name: Alembic migrations apply and reverse
        # A migration that cannot be rolled back is a deploy that cannot be
        # undone. The Phase 0 pair is exercised in both directions, and a
        # single head is asserted so a branched chain fails here rather than
        # at deploy time.
        env:
          DATABASE_URL: sqlite:///./data/ci-migrations.db
        run: |
          mkdir -p data
          heads="$(alembic heads | wc -l | tr -d ' ')"
          test "$heads" = "1" || { echo "expected exactly one Alembic head"; alembic heads; exit 1; }
          alembic upgrade head
          alembic downgrade -1
          alembic downgrade -1
          alembic upgrade head

      - name: Run pytest
        run: pytest tests/ -v --tb=short --junitxml=pytest-report.xml

      - name: Publish failing test IDs as annotations
        # Job logs need authentication to read; annotations are public, so a
        # red build always says which tests failed.
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("pytest-report.xml").getroot()
          except (FileNotFoundError, ET.ParseError):
              print("::error::pytest produced no report (did an earlier step fail?)")
              raise SystemExit(0)
          bad = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in root.iter("testcase")
              if case.find("failure") is not None or case.find("error") is not None
          ]
          for test_id in bad[:50]:
              print(f"::error title=pytest failure::{test_id}")
          print(f"::notice::{len(bad)} failing test(s)")
          PY

      - name: Set up Node (for API schema/type drift check)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies (for schema/type drift check)
        working-directory: web
        run: npm ci

      - name: API schema and client types are current
        run: |
          python scripts/generate_signature_expectations.py
          python scripts/generate_canonical_query_cases.py
          python scripts/generate_openapi.py
          cd web && npm run api:types
          cd .. && git diff --exit-code -- web/lib/api web/__tests__/fixtures

      - name: Coverage gate (services >= 80%)
        run: pytest --cov=src/tradelens/services --cov-fail-under=80 -q

      - name: Build marketing site (smoke test)
        env:
          SITE_ORIGIN: https://www.tradelensai.io
          APP_ORIGIN: https://app.tradelensai.io
          SUPPORT_EMAIL: support@example.com
        run: python -m scripts.build_site

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SITE_ORIGIN: https://www.tradelensai.io
      APP_ORIGIN: https://app.tradelensai.io
      SUPPORT_EMAIL: support@tradelensai.io
      SIGNUP_MODE: closed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Run web lint
        run: npm run lint

      - name: Run web typecheck
        run: npm run typecheck

      - name: Build the deployed Next.js app
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker-api:
    # Production gate 4: the API/worker image builds, starts in production
    # mode, and answers /health. The Postgres here is a disposable service
    # container that lives only for this job; it is not the Neon database and
    # proves nothing about Postgres concurrency (that is gate 1).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: tradelens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tradelens_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      IMG: tradelens-api:ci
      CI_DB: postgresql://ci:ci-only-disposable@localhost:5432/tradelens_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f Dockerfile.api -t "$IMG" .

      - name: Image carries no Streamlit-surface packages and runs as non-root
        run: |
          docker run --rm "$IMG" python -c "import importlib.util as u; bad=[m for m in ('streamlit','pyarrow','plotly') if u.find_spec(m)]; assert not bad, bad"
          test "$(docker run --rm "$IMG" id -u)" = "10001"

      - name: Generate a throwaway service secret
        run: echo "TL_SERVICE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Production mode refuses an ephemeral SQLite database
        run: |
          if timeout 60 docker run --rm -e TL_ENV=production \
               -e DATABASE_URL=sqlite:///./x.db -e TL_SERVICE_SECRET "$IMG" \
               > refuse.log 2>&1; then
            echo "API started in production against SQLite"; exit 1
          fi
          # Refused for the right reason, not merely crashed.
          grep -q "invalid production configuration: DATABASE_URL" refuse.log \
            || { cat refuse.log; exit 1; }

      - name: Migrations apply inside the image
        run: |
          docker run --rm --network host -e DATABASE_URL="$CI_DB" "$IMG" alembic upgrade head
          test "$(docker run --rm --network host -e DATABASE_URL="$CI_DB" "$IMG" alembic heads | wc -l)" = "1"

      - name: API starts and answers /health
        run: |
          docker run -d --name api --network host -e TL_ENV=production \
            -e DATABASE_URL="$CI_DB" -e TL_SERVICE_SECRET "$IMG"
          for i in $(seq 1 60); do
            body="$(curl -fsS http://localhost:8000/health || true)"
            [ "$body" = '{"status":"ok"}' ] && break
            sleep 1
          done
          test "$body" = '{"status":"ok"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = "404"

      - name: Worker starts and stays up
        run: |
          docker run -d --name worker --network host -e TL_ENV=production \
            -e DATABASE_URL="$CI_DB" "$IMG" python -m src.tradelens.api.worker
          sleep 15
          test "$(docker inspect -f '{{.State.Running}}' worker)" = "true"
          docker logs worker 2>&1 | grep -q "worker started"

      - name: Container logs
        if: always()
        run: |
          docker logs api 2>&1 | tail -50 || true
          docker logs worker 2>&1 | tail -50 || true
