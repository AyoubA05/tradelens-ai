[theme]
# Fixed hybrid theme: a light mineral workspace for reading, forms, tables
# and decisions; the navigation rail, chart stages and focused AI reading
# surfaces are painted dark by src/tradelens/ui/design_system.py.
# There is no theme toggle — a surface is light or dark because of the job
# it does. Palette source of truth: design_system.py (premium redesign).
base = "light"
# Must equal design_system.TL_ACTION — Streamlit paints its own focus rings
# and widget accents from this value (parity is tested).
primaryColor = "#087C71"
backgroundColor = "#F3F6F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#132125"
font = "sans serif"

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's auto page nav — TradeLens renders its own labeled menu
# (components/sidebar.py) so the sidebar shows exactly six destinations.
showSidebarNavigation = false
# Config-first chrome suppression (verified valid on streamlit==1.50.0 via
# docs): hides deploy button + dev menu without CSS hacks on unproven
# selectors like stToolbar/stDecoration.
toolbarMode = "minimal"
