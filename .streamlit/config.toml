[theme]
# One fixed tonal-dark theme. There is no toggle. Streamlit paints its own
# chrome — focus rings, widget accents, the app background — from these four
# values, so they must equal the role tokens or the framework and the design
# system put two different palettes on the same screen. Parity is tested in
# tests/test_design_system.py.
# Source of truth: src/tradelens/ui/design_system.py
base = "dark"
primaryColor = "#00e5cc"          # TL_ACCENT_ACTION
backgroundColor = "#091216"       # TL_SURFACE_CANVAS
secondaryBackgroundColor = "#101B20"  # TL_SURFACE_PANEL
textColor = "#ECF5F4"             # TL_CONTENT_PRIMARY
font = "sans serif"

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's auto page nav — TradeLens renders its own labeled menu
# (components/sidebar.py) so the sidebar shows exactly six destinations.
showSidebarNavigation = false
# Config-first chrome suppression (verified valid on streamlit==1.50.0 via
# docs): hides deploy button + dev menu without CSS hacks on unproven
# selectors like stToolbar/stDecoration.
toolbarMode = "minimal"
