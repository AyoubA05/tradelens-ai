[theme]
base = "dark"
primaryColor = "#20808D"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E8EAED"
font = "sans serif"

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's auto page nav — TradeLens renders its own labeled menu
# (components/sidebar.py) so the sidebar shows exactly six destinations.
showSidebarNavigation = false
