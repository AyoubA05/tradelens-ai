[theme]
base = "dark"
# Palette source of truth: src/tradelens/ui/design_system.py (2026-07 polish pass)
primaryColor = "#00c2b2"
backgroundColor = "#0d0f11"
secondaryBackgroundColor = "#13161a"
textColor = "#e8eaed"
font = "sans serif"

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's auto page nav — TradeLens renders its own labeled menu
# (components/sidebar.py) so the sidebar shows exactly six destinations.
showSidebarNavigation = false
# Config-first chrome suppression (verified valid on streamlit==1.50.0 via
# docs): hides deploy button + dev menu without CSS hacks on unproven
# selectors like stToolbar/stDecoration.
toolbarMode = "minimal"
